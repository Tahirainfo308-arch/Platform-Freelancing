# -------------------------------------------------------------
# 1. Database Storage PersistentVolumeClaim
# -------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# -------------------------------------------------------------
# 2. Database Service & StatefulSet (PostgreSQL)
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ame-postgres-svc
spec:
  ports:
    - port: 5432
  selector:
    app: ame-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ame-postgres
spec:
  serviceName: "ame-postgres-svc"
  replicas: 1
  selector:
    matchLabels:
      app: ame-postgres
  template:
    metadata:
      labels:
        app: ame-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "ame_db"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# -------------------------------------------------------------
# 3. Cache Service & Deployment (Redis)
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ame-redis-svc
spec:
  ports:
    - port: 6379
  selector:
    app: ame-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ame-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ame-redis
  template:
    metadata:
      labels:
        app: ame-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
# -------------------------------------------------------------
# 4. AME API Application Deployment
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ame-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ame-api
  template:
    metadata:
      labels:
        app: ame-api
    spec:
      containers:
        - name: api
          image: your-registry/workly-ame-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ame-config
          env:
            - name: AME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ame-secrets
                  key: AME_API_KEY
            - name: AME_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ame-secrets
                  key: AME_WEBHOOK_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ame-secrets
                  key: GEMINI_API_KEY
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ame-secrets
                  key: HUGGINGFACE_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
# -------------------------------------------------------------
# 5. AME Service NodePort / LoadBalancer
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ame-api-svc
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: ame-api
---
# -------------------------------------------------------------
# 6. Horizontal Pod Autoscaler (Scaling)
# -------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ame-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ame-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# -------------------------------------------------------------
# 7. Ingress Controller Routing
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ame-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: ai.workly.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ame-api-svc
                port:
                  number: 8000
